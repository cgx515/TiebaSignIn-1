name: Daily Tieba Sign-In

on:
  workflow_dispatch:
  schedule:
    # 北京时间 06:13 主运行，09:13 / 12:13 补跑。
    # GitHub 的 schedule 在高负载时会延迟甚至丢弃任务（官方文档明确说明），
    # 多次触发可兜底；当天若已有成功运行，后续运行会被 guard 步骤自动跳过。
    - cron: '13 22 * * *'
    - cron: '13 1 * * *'
    - cron: '13 4 * * *'

jobs:
  signin:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check if already signed in today
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "手动触发，直接执行"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 注意：run 步骤默认 set -e，因此查询失败时必须兜底为 0（fail-open），
          # 否则 guard 一失败就会中断整个 job，导致当天反而漏签。
          day_start=$(TZ=Asia/Shanghai date -d "today 00:00" -u +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || echo "")
          if [ -z "$day_start" ]; then
            echo "无法计算今日起点，为安全起见继续签到"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count=$(gh run list --workflow tieba.yml --status success --limit 100 \
            --json createdAt --jq "[.[] | select(.createdAt >= \"$day_start\")] | length" 2>/dev/null || echo 0)
          case "$count" in ''|*[!0-9]*) count=0 ;; esac
          echo "今日起点(UTC): $day_start"
          echo "今日已成功运行: $count 次"
          if [ "$count" -gt 0 ]; then
            echo "今天已签到成功，跳过本次补跑"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install requests

      - name: Run sign-in (account 1)
        if: steps.guard.outputs.skip != 'true'
        env:
          BDUSS: ${{ secrets.BDUSS }}
          WECHAT_WEBHOOK_KEY: ${{ secrets.WECHAT_WEBHOOK_KEY }}
        run: python run.py

      - name: Run sign-in (account 2)
        if: steps.guard.outputs.skip != 'true'
        env:
          BDUSS: ${{ secrets.BDUSS_2 }}
          WECHAT_WEBHOOK_KEY: ${{ secrets.WECHAT_WEBHOOK_KEY }}
        run: python run.py

  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
