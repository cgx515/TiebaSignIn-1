name: Daily Tieba Sign-In

on:
  workflow_dispatch:
    inputs:
      force:
        description: '强制签到（忽略当天已成功的记录）'
        type: boolean
        default: false
  schedule:
    # UTC 22:30 = 北京时间次日 06:30；GitHub 调度可能延迟。
    - cron: '30 22 * * *'
    # 北京时间 09:13、12:13、15:13 补跑，当天成功后自动跳过。
    - cron: '13 1,4,7 * * *'

concurrency:
  group: daily-tieba-signin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  signin:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check if already signed in today
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "强制模式，直接执行签到"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          day_start=$(date -u -d "$(TZ=Asia/Shanghai date +%F) 00:00:00 +0800" +%Y-%m-%dT%H:%M:%SZ)
          count=$(gh run list --workflow tieba.yml --status success --limit 100 \
            --json createdAt --jq "[.[] | select(.createdAt >= \"$day_start\")] | length" 2>/dev/null || echo 0)
          case "$count" in ''|*[!0-9]*) count=0 ;; esac
          echo "今日起点(UTC): $day_start"
          echo "今日已成功运行: $count 次"
          if [ "$count" -gt 0 ]; then
            echo "今天已成功签到，跳过本次运行"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: python -m pip install 'requests>=2.32,<3'

      - name: Run sign-in and verify result
        if: steps.guard.outputs.skip != 'true'
        env:
          BDUSS: ${{ secrets.BDUSS }}
          WECHAT_WEBHOOK_KEY: ${{ secrets.WECHAT_WEBHOOK_KEY }}
        shell: bash
        run: |
          if [ -z "$BDUSS" ]; then
            echo "::error::请先在 Settings → Secrets and variables → Actions 添加 BDUSS。"
            exit 1
          fi
          set -o pipefail
          log_file="$RUNNER_TEMP/tieba-signin.log"
          python -u run.py 2>&1 | tee "$log_file"
          if ! grep -Eq '^贴吧总数: [1-9][0-9]*$' "$log_file"; then
            echo "::error::没有获得有效签到汇总，请检查 BDUSS 是否有效以及账号是否关注贴吧。"
            exit 1
          fi
          if ! grep -Eq '^签到失败: 0$' "$log_file"; then
            echo "::error::仍有贴吧签到失败，后续定时任务将继续补跑。"
            exit 1
          fi

  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
