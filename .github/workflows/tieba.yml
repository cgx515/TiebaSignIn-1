name: Daily Tieba Sign-In

on:
  workflow_dispatch:
    inputs:
      force:
        description: '强制签到（忽略当天已成功的记录）'
        type: boolean
        default: false
  schedule:
    # 主触发：外部 cron 服务每天北京时间 06:30 调用 workflow_dispatch（准点）。
    # 以下为兜底补跑：若主触发失败或被丢弃，则在北京 09:13 / 12:13 / 15:13 重试。
    # 当天若已有成功运行，guard 会自动跳过，避免重复签到与重复推送。
    - cron: '13 1 * * *'
    - cron: '13 4 * * *'
    - cron: '13 7 * * *'

jobs:
  signin:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check if already signed in today
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "强制模式，忽略当天记录，直接执行"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 注意：run 步骤默认 set -e，因此查询失败时必须兜底为 0（fail-open），
          # 否则 guard 一失败就会中断整个 job，导致当天反而漏签。
          day_start=$(TZ=Asia/Shanghai date -d "today 00:00" -u +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || echo "")
          if [ -z "$day_start" ]; then
            echo "无法计算今日起点，为安全起见继续签到"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count=$(gh run list --workflow tieba.yml --status success --limit 100 \
            --json createdAt --jq "[.[] | select(.createdAt >= \"$day_start\")] | length" 2>/dev/null || echo 0)
          case "$count" in ''|*[!0-9]*) count=0 ;; esac
          echo "今日起点(UTC): $day_start"
          echo "今日已成功运行: $count 次"
          if [ "$count" -gt 0 ]; then
            echo "今天已签到成功，跳过本次运行"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install requests

      - name: Run sign-in (account 1)
        if: steps.guard.outputs.skip != 'true'
        env:
          BDUSS: ${{ secrets.BDUSS }}
          WECHAT_WEBHOOK_KEY: ${{ secrets.WECHAT_WEBHOOK_KEY }}
        run: python run.py

      - name: Run sign-in (account 2)
        if: steps.guard.outputs.skip != 'true'
        env:
          BDUSS: ${{ secrets.BDUSS_2 }}
          WECHAT_WEBHOOK_KEY: ${{ secrets.WECHAT_WEBHOOK_KEY }}
        run: python run.py

  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
